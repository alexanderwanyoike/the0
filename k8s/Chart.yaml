maintainers:
  - name: Alexander Wanyoike
    url: https://github.com/alexanderwanyoike
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/8xpMh3RR3
  artifacthub.io/changes: |
    - kind: changed
      description: "The frontend forwards every api call through one proxy route, and browser code uses one HTTP client that shows the api's own error message"
    - kind: removed
      description: "The frontend no longer verifies JWTs itself or reads JWT_SECRET; the api enforces auth, and the chart stops passing the secret to the frontend"
    - kind: changed
      description: "The api answers every failure with one typed error and status mapping: a missing or hidden resource is 404, a database or storage failure is 500 with a fixed message, never the driver's text"
    - kind: changed
      description: "MCP tools return structured errors with a code and check their arguments against the same rules as the REST endpoints"
    - kind: changed
      description: "Custom bot names must be lowercase letters and numbers with single hyphens between them; a leading, trailing or doubled hyphen is refused"
    - kind: fixed
      description: "Publishing a Custom bot version checks the config before touching storage and answers 400 for a missing, invalid or non-object config"
    - kind: fixed
      description: "Request logs redact the x-api-key header"
    - kind: changed
      description: "The custom dashboard contract is defined once in the0-react and imported by the frontend"
    - kind: security
      description: "follow-redirects 1.16.2 in the frontend (GHSA-mrwp-f3q8-3g9p)"
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
