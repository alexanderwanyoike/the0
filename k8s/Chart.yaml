annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/8xpMh3RR3
  artifacthub.io/changes: |
    - kind: fixed
      description: "A bot change reaches the runtime even when NATS is down at that moment: the change and its event are saved together in a new outbox table (migration 0007), and a relay keeps sending the event until JetStream confirms it. Requests no longer wait on NATS"
    - kind: fixed
      description: "The runtime reads bot events through durable JetStream consumers, so events published while it is restarting are no longer lost, a failed event is retried instead of dropped, and handlers are safe to repeat"
    - kind: fixed
      description: "Updates and deletes of a bot running another user's custom bot now reach the runtime, and a delete whose custom bot version is no longer in the catalogue is sent to both the realtime and the scheduled subject"
    - kind: fixed
      description: "A schedule update that changes nothing no longer fails and holds up later schedule events"
    - kind: changed
      description: "Bot deploy, update and delete are commands through one command bus shared by REST and MCP, each carrying who made the change; repositories are private to their modules, enforced by a test in the api's test suite"
    - kind: changed
      description: "One auth guard serves REST and MCP: API keys are accepted in x-api-key on every route, and x-api-key wins when a request also sends Authorization"
    - kind: changed
      description: "THE0_EVENTS keeps message ids for one hour to drop repeated publishes; the setting is updated in place on the existing stream"
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
