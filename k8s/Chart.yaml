apiVersion: v2
name: the0
description: An open-source algorithmic trading platform for creating, deploying, and managing trading bots
type: application
version: 0.11.4
appVersion: "1.16.3"
kubeVersion: ">=1.21.0-0"
keywords:
  - trading
  - bots
  - backtesting
  - automation
  - fintech
home: https://github.com/alexanderwanyoike/the0
sources:
  - https://github.com/alexanderwanyoike/the0
icon: https://raw.githubusercontent.com/alexanderwanyoike/the0/main/assets/the0-icon.png
maintainers:
  - name: Alexander Wanyoike
    url: https://github.com/alexanderwanyoike
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/8xpMh3RR3
  artifacthub.io/changes: |
    - kind: fixed
      description: "Failed Python and Node bot runs now fail: a bot that calls the0.error(), exits non-zero or raises an uncaught exception ends its run with a non-zero exit and logs its error message, instead of being recorded as a success. A bot's own success result and data are no longer overwritten"
    - kind: changed
      description: "Kubernetes no longer retries a failed scheduled run (Job backoffLimit 0, as in Docker mode), so a run that failed after placing an order cannot place it again. The next run comes from the schedule, and existing CronJobs are updated on the first reconcile"
    - kind: security
      description: "MCP bot tools go through the same bot service as the REST API and CLI: config validation and the major version guard apply, the runtime hears about MCP deploys, updates and deletes, and deleting a bot you do not own reports not found. A partial-config bot_update is now rejected, as it is over REST"
    - kind: fixed
      description: "Realtime bot queries deliver their params in the URL query string, where every SDK query server reads them. Null params stay out of the query string"
    - kind: fixed
      description: "the0 custom-bot deploy builds a custom bot's frontend once per deploy instead of twice"
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
