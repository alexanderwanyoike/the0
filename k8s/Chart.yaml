maintainers:
  - name: Alexander Wanyoike
    url: https://github.com/alexanderwanyoike
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/8xpMh3RR3
  artifacthub.io/changes: |
    - kind: fixed
      description: "Rotating the storage credentials no longer breaks scheduled bots: bot, CronJob and query pods read the storage keys from the release's Secret instead of keeping copies of them"
    - kind: fixed
      description: "Existing CronJobs and realtime bot pods are updated whenever anything the controller writes into them changes, such as the storage endpoint, buckets or credentials"
    - kind: security
      description: "Storage credentials are no longer stored in plain text in bot pod, CronJob and Job specs"
    - kind: changed
      description: "Upgrading restarts every realtime bot pod and rewrites every scheduled-bot CronJob once"
    - kind: security
      description: "Runtime and CLI built with Go 1.26.10, which distrusts compromised intermediate certificates in crypto/x509 (GO-2026-6809)"
    - kind: security
      description: "follow-redirects 1.16.1 in the api and frontend, which strips credential headers on cross-origin redirects (GHSA-8r9p-f939-6h3c, GHSA-q3jh-wrc6-jgq8)"
    - kind: security
      description: "Frontend on next 15.5.28 (GHSA-2464-fhr4-w9xw, GHSA-p3m5-59mp-jv5r)"
    - kind: security
      description: "Docs site built with vite 6.4.5 (GHSA-587h-7wmj-h5pm)"
    - kind: fixed
      description: "The api image builds against current Alpine packages again"
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
