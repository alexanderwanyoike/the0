apiVersion: v2
name: the0
description: An open-source algorithmic trading platform for creating, deploying, and managing trading bots
type: application
version: 0.14.0
appVersion: "1.19.0"
kubeVersion: ">=1.21.0-0"
keywords:
  - trading
  - bots
  - backtesting
  - automation
  - fintech
home: https://github.com/alexanderwanyoike/the0
sources:
  - https://github.com/alexanderwanyoike/the0
icon: https://raw.githubusercontent.com/alexanderwanyoike/the0/main/assets/the0-icon.png
maintainers:
  - name: Alexander Wanyoike
    url: https://github.com/alexanderwanyoike
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/8xpMh3RR3
  artifacthub.io/changes: |
    - kind: fixed
      description: "Deleting a custom bot version can no longer remove a bot deployed on it at the same moment: the database refuses the delete (migration 0008) and the api answers that the version is in use"
    - kind: fixed
      description: "Bucket name overrides reach bots: Docker passes its code, state, logs and query results buckets to bot containers, pods get the controller's code and state buckets, and logs are saved to the configured logs bucket instead of always bot-logs"
    - kind: fixed
      description: "Compiled bots' query binaries are made executable before a query or the query server runs them"
    - kind: changed
      description: "A query starts as runtime execute --query=<path> on Docker and Kubernetes alike, without a bot run's settings, and always gets QUERY_PARAMS, an empty object when there are none"
    - kind: removed
      description: "The unused QUERY_PARAM_<key> variables are no longer set; bots read QUERY_PARAMS"
    - kind: changed
      description: "One launch module in the runtime defines every setting a launcher passes to runtime execute, checked by a round-trip test for every mode on both backends; the controller's --minio-bucket default is now custom-bots, the bucket pods have always read"
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
