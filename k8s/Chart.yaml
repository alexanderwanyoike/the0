apiVersion: v2
name: the0
description: An open-source algorithmic trading platform for creating, deploying, and managing trading bots
type: application
version: 0.17.0
appVersion: "1.22.0"
kubeVersion: ">=1.21.0-0"
keywords:
  - trading
  - bots
  - backtesting
  - automation
  - fintech
home: https://github.com/alexanderwanyoike/the0
sources:
  - https://github.com/alexanderwanyoike/the0
icon: https://raw.githubusercontent.com/alexanderwanyoike/the0/main/assets/the0-icon.png
maintainers:
  - name: Alexander Wanyoike
    url: https://github.com/alexanderwanyoike
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/8xpMh3RR3
  artifacthub.io/changes: |
    - kind: changed
      description: "The api, gc and bot controller read the NATS URL, MinIO host and port, logs bucket and code bucket from one chart value each, so the two sides cannot drift"
    - kind: changed
      description: "The bot controller takes logs and query results bucket settings, and bot pods, sync sidecars and query pods use them instead of fixed bucket names"
    - kind: fixed
      description: "The aws and gcp example values no longer point the api and the bot controller at different code buckets"
    - kind: fixed
      description: "gc cleans the logs bucket the api reads and the bot pods write"
    - kind: changed
      description: "If only botController.minio.bucket is set, the api now uses that code bucket too; copy existing objects from custom-bots or set the0Api.env.CUSTOM_BOTS_BUCKET"
    - kind: changed
      description: "The api defaults LOG_BUCKET to bot-logs"
    - kind: removed
      description: "The unused API_BASE_URL value"
    - kind: fixed
      description: "Bots on Docker get the runner's state size limits, and a bot without config gets BOT_CONFIG={} on Docker and Kubernetes alike"
    - kind: removed
      description: "Docker bot containers no longer set the unread ID, CONFIG, ENTRYPOINT_TYPE and CODE_MOUNT_DIR variables"
    - kind: changed
      description: "Upgrading rewrites every scheduled-bot CronJob and restarts every realtime bot pod once"
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
