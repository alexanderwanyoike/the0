annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/8xpMh3RR3
  artifacthub.io/changes: |
    - kind: added
      description: Swagger UI at /docs and the OpenAPI spec at /docs-json for the api - off by default in this chart, set the0Api.env.SWAGGER_ENABLED to "true" to serve them
    - kind: security
      description: Login no longer reveals whether an account exists or is inactive - the password is checked first, and unknown emails cost the same bcrypt comparison
    - kind: security
      description: API key checks no longer return database error details to clients - a rejected key gets a generic "Invalid API key" and the reason is logged server side
    - kind: fixed
      description: A database outage during JWT or API key checks now answers 503 instead of 401, so a brief outage no longer logs users out
    - kind: fixed
      description: The MCP tools/list schema for bot_deploy matches what the handler reads (the name lives in config.name)
    - kind: security
      description: axios and brace-expansion bumped past new HIGH advisories in the api, frontend and React SDK
    - kind: removed
      description: The unused hello-world GET / endpoint, and the never-connected MCP SDK server with its @modelcontextprotocol/sdk and zod dependencies
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
