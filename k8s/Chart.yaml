annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/8xpMh3RR3
  artifacthub.io/changes: |
    - kind: fixed
      description: Querying a path a bot does not define returns the bot's own error and the paths it does answer, e.g. "No handler for path: /status (available: /today, /history, /health, /info)", instead of the runtime job's logs
    - kind: fixed
      description: Querying a bot with no query entrypoint answers 422 "This bot defines no queries" instead of 404 "bot not found"
    - kind: security
      description: A query never runs a bot's main entrypoint - Kubernetes query pods and the in-container runner refuse a bot without a query entrypoint, and query pods now set QUERY_ENTRYPOINT
    - kind: fixed
      description: Query results are removed from object storage even when the query hits its timeout
    - kind: security
      description: Runtime and CLI built with Go 1.26.9 (net/http, crypto/tls and net/textproto advisories), with mongo-driver, moby/go-archive, x/crypto and x/net bumps
    - kind: security
      description: Cleared yarn audit findings in proxy-addr (api), handlebars (React SDK), vue and source-map-js (docs, frontend)
    - kind: added
      description: Docs Recipes section with step-by-step build walkthroughs, starting with the python-macro-event-guard example bot
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
