maintainers:
  - name: Alexander Wanyoike
    url: https://github.com/alexanderwanyoike
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/g5mp57nK
  artifacthub.io/changes: |
    - kind: changed
      description: Bundled object store moves to Silo (pgsty/silo, pinned to RELEASE.2026-09-16T00-00-00Z), the maintained continuation of the pgsty/minio fork - existing data volumes are read in place, see the migration guide
    - kind: changed
      description: Bundled object store Deployment passes args to the image entrypoint instead of overriding the command, and uses the Recreate strategy so an upgrade never runs two servers on one volume
    - kind: changed
      description: API and frontend images run on Node.js 22 because Node.js 20 is end of life upstream, with better-sqlite3 bumped to 12.x
    - kind: fixed
      description: Scheduled bot runs no longer lose their output when the container exits quickly - containers are removed after their logs are read, and the scheduler cleans up orphaned scheduled containers after five minutes
    - kind: security
      description: Bundled object store picks up Silo security fixes (SN-2026-005 onwards) that the frozen pgsty/minio image does not have
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
