name: the0
description: An open-source algorithmic trading platform for creating, deploying, and managing trading bots
type: application
version: 0.18.0
appVersion: "1.23.0"
kubeVersion: ">=1.21.0-0"
keywords:
  - trading
  - bots
  - backtesting
  - automation
  - fintech
home: https://github.com/alexanderwanyoike/the0
sources:
