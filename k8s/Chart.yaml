apiVersion: v2
name: the0
description: An open-source algorithmic trading platform for creating, deploying, and managing trading bots
type: application
version: 0.15.0
appVersion: "1.20.0"
kubeVersion: ">=1.21.0-0"
keywords:
  - trading
  - bots
  - backtesting
  - automation
  - fintech
home: https://github.com/alexanderwanyoike/the0
sources:
  - https://github.com/alexanderwanyoike/the0
icon: https://raw.githubusercontent.com/alexanderwanyoike/the0/main/assets/the0-icon.png
maintainers:
  - name: Alexander Wanyoike
    url: https://github.com/alexanderwanyoike
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/8xpMh3RR3
  artifacthub.io/changes: |
    - kind: fixed
      description: "Docker and Kubernetes run the same bots: both treat a bot or schedule as enabled unless config.enabled is false, and the dashboard shows a bot as enabled by the same rule"
    - kind: fixed
      description: "A schedule enabled again in Docker mode first runs at its next tick, as on Kubernetes, instead of at once for a tick it missed"
    - kind: fixed
      description: "The Kubernetes sync sidecar makes its final state and log sync within its deadline when stopped, instead of with an already cancelled context"
    - kind: changed
      description: "Schedules are standard 5-field cron in both modes; a 6-field expression is refused instead of having its seconds trimmed on Kubernetes"
    - kind: changed
      description: "One subscriber stores bot and schedule events on the same durable JetStream consumers, so an upgrade resumes where they stopped; the controller now uses one NATS connection and one MongoDB client"
    - kind: removed
      description: "Unused code: partitions, the daemon init command, the done-file mechanism and the IS_SCHEDULED variable it relied on"
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
