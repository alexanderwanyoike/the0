annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.the0.app
    - name: Source
      url: https://github.com/alexanderwanyoike/the0
    - name: Discord
      url: https://discord.gg/g5mp57nK
  artifacthub.io/changes: |
    - kind: added
      description: nodejs22 bot runtime - the runtime image carries Node.js 22 as the default node next to Node.js 20.20.2, which is only used by bots that still declare nodejs20
    - kind: changed
      description: CLI vendors Node bots in the Node version their runtime runs on, so native addons match the ABI, and the frontend bundle builds on Node.js 22
    - kind: deprecated
      description: nodejs20 bot runtime - Node.js 20 is end of life upstream, deploying a nodejs20 bot prints a warning pointing at nodejs22
    - kind: removed
      description: npm and corepack are no longer in the runtime image - bots that shell out to npm or npx at run time must vendor what they need at deploy time
    - kind: security
      description: browserslist pinned past its HIGH advisories in the frontend and the React SDK
  artifacthub.io/images: |
    - name: api
      image: ghcr.io/alexanderwanyoike/the0/api
    - name: frontend
      image: ghcr.io/alexanderwanyoike/the0/frontend
    - name: runtime
      image: ghcr.io/alexanderwanyoike/the0/runtime
