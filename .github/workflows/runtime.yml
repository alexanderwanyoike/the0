name: Runtime Service

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
    paths:
      - 'runtime/**'
      - 'sdk/contract/**'
      - '.github/workflows/runtime.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'sdk/contract/**'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/runtime

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.9'
        cache-dependency-path: runtime/go.sum

    - name: Download dependencies
      working-directory: ./runtime
      run: go mod download

    - name: Log in to Docker Hardened Images
      uses: docker/login-action@v3
      with:
        registry: dhi.io
        username: ${{ secrets.DHI_USERNAME }}
        password: ${{ secrets.DHI_TOKEN }}

    - name: Build runtime image for integration tests
      run: docker build -t the0/runtime:latest ./runtime

    # The bot contract check (cmd/app/contract_e2e_test.go) runs Node.js bots
    # on the SDK built from this tree.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'yarn'
        cache-dependency-path: sdk/nodejs/yarn.lock

    - name: Build the Node.js SDK
      working-directory: ./sdk/nodejs
      run: |
        yarn install --frozen-lockfile
        yarn build

    - name: Run tests
      working-directory: ./runtime
      run: go test -p 1 ./...

  analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.9'
        cache-dependency-path: runtime/go.sum

    - name: Install golangci-lint
      continue-on-error: true
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0
        install-only: true

    - name: golangci-lint report (non-blocking)
      working-directory: ./runtime
      continue-on-error: true
      run: >-
        bash "$GITHUB_WORKSPACE/.github/scripts/summary-code-block.sh" "runtime: golangci-lint"
        golangci-lint run --config .golangci.yml --output.tab.path=stdout ./...

    - name: deadcode report (non-blocking)
      working-directory: ./runtime
      continue-on-error: true
      run: |
        # stderr only on failure: on success it is just "go: downloading" noise.
        bash "$GITHUB_WORKSPACE/.github/scripts/summary-code-block.sh" "runtime: deadcode (unreachable from main)" \
          sh -c 'make -s deadcode 2> "$RUNNER_TEMP/deadcode.err" || { s=$?; cat "$RUNNER_TEMP/deadcode.err"; exit "$s"; }'

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hardened Images
      uses: docker/login-action@v3
      with:
        registry: dhi.io
        username: ${{ secrets.DHI_USERNAME }}
        password: ${{ secrets.DHI_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./runtime
        file: ./runtime/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
