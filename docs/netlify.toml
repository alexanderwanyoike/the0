[build]
  base = "docs"
  publish = ".vitepress/dist"
  command = "yarn build"
  # Always build. Netlify skips a build when this exits 0. Comparing against
  # CACHED_COMMIT_REF canceled every production deploy, because the release
  # PR's deploy preview has already built the same docs by the time main
  # builds. Only releases push to main, so skipping saves nothing.
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
